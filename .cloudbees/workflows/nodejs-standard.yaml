apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: nodejs-standard

on:
  workflow_call:

jobs:
  build-test-security:

    steps:

      - name: Checkout source code
        uses: cloudbees-io/checkout@v1

      - name: Install dependencies
        uses: docker://node:20-alpine
        shell: sh
        run: |
          npm install

      - name: Run dependency security audit
        uses: docker://node:20-alpine
        shell: sh
        run: |
          npm audit --audit-level=high

      - name: Run application tests
        uses: docker://node:20-alpine
        shell: sh
        run: |
          npm test

      - name: Create deployable artifact
        uses: docker://node:20-alpine
        shell: sh
        run: |
          mkdir -p dist
          tar -czf dist/application.tar.gz .

      - name: Register build artifact
        id: register-artifact
        uses: cloudbees-io/register-build-artifact@v2
        with:
          name: customer-portal
          version: "1.0.0"
          url: docker.io/alvarotoscano/customer-portal:1.0.0

      - name: Simulate deployment to staging
        uses: docker://node:20-alpine
        shell: sh
        run: |
          echo "Deploying application to staging..."
          echo "Deployment completed successfully"
      
      - name: Register deployment
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ steps.register-artifact.outputs.artifact-id }}
          target-environment: STAGING